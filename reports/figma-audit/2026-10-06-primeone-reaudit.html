<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auditoría de librería Figma</title>
  <!-- Proeduca Sans: ruta relativa a src/fonts del repo PrimeOne-DS. Fuera del repo cae a la fuente del sistema. -->
  <link rel="stylesheet" href="../../src/fonts/proeduca-sans.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css" />
  <style>
    /* Paleta del tema Estudiantes (src/theme/presets.ts): BLUE_UNIR y SURFACE_ESTUDIANTES */
    :root {
      --primary-50: #f9fcff; --primary-100: #e7effe; --primary-200: #cfdffc; --primary-300: #9ec0fa;
      --primary-400: #6ea0f7; --primary-500: #3d81f5; --primary-600: #0d61f2; --primary-700: #0a4ec2;
      --primary-800: #083a91; --primary-900: #052761; --primary-950: #031330;
      --surface-0: #ffffff; --surface-50: #fcfcfe; --surface-100: #f7f8fd; --surface-200: #eff2fb;
      --surface-300: #ebeefa; --surface-400: #bbc1d8; --surface-500: #848eae; --surface-600: #5a6481;
      --surface-700: #4a5268; --surface-800: #383c48; --surface-900: #22252f; --surface-950: #181c26;

      --bg: var(--surface-50);
      --card: var(--surface-0);
      --border: var(--surface-300);
      --text: var(--surface-900);
      --muted: var(--surface-600);
      --accent: var(--primary-600);
      --code-bg: var(--surface-200);
      --hero-a: var(--primary-800); --hero-b: var(--primary-600); --hero-c: var(--primary-500);

      --sev-critical: #dc2626; --sev-critical-bg: #fef2f2;
      --sev-warning: #b45309; --sev-warning-bg: #fffbeb;
      --sev-info: var(--primary-700); --sev-info-bg: var(--primary-100);
      --sev-ok: #15803d; --sev-ok-bg: #f0fdf4;

      --radius: 12px;
      --radius-sm: 8px;
      --font: 'Proeduca Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: light;
    }

    html.dark {
      --bg: var(--surface-950);
      --card: var(--surface-900);
      --border: var(--surface-800);
      --text: var(--surface-100);
      --muted: var(--surface-400);
      --accent: var(--primary-400);
      --code-bg: var(--surface-800);
      --hero-a: var(--primary-950); --hero-b: var(--primary-900); --hero-c: var(--primary-800);
      --sev-critical: #f87171; --sev-critical-bg: rgb(220 38 38 / 0.16);
      --sev-warning: #fbbf24; --sev-warning-bg: rgb(217 119 6 / 0.16);
      --sev-info: var(--primary-300); --sev-info-bg: rgb(61 129 245 / 0.18);
      --sev-ok: #4ade80; --sev-ok-bg: rgb(22 163 74 / 0.16);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9375rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); }
    code {
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--code-bg);
      font-family: var(--mono);
      font-size: 0.8125em;
      overflow-wrap: anywhere;
    }

    /* Hero: misma banda de marca que la home del explorador */
    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 20%, rgb(255 255 255 / 0.18), transparent 45%),
        radial-gradient(circle at 10% 110%, rgb(255 255 255 / 0.1), transparent 40%),
        linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 60%, var(--hero-c) 100%);
      color: #fff;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgb(255 255 255 / 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to right, transparent 10%, #000 75%);
    }
    .hero__inner {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 48px;
      align-items: center;
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 56px 32px 40px;
    }
    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border: 1px solid rgb(255 255 255 / 0.3);
      border-radius: 999px;
      background: rgb(255 255 255 / 0.1);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .hero h1 {
      margin: 20px 0 12px;
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
    }
    .hero h1 span { display: block; font-weight: 400; opacity: 0.85; }
    .hero__meta { margin: 0; opacity: 0.9; }
    .hero__meta a { color: #fff; }
    .hero__actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: 1px solid rgb(255 255 255 / 0.4);
      border-radius: 999px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .cta:hover { background: rgb(255 255 255 / 0.12); }
    .cta--solid { background: #fff; color: var(--primary-700); border-color: transparent; }
    .cta--solid:hover { background: var(--primary-50); }
    .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* Anillo de score */
    .ring { position: relative; width: 168px; height: 168px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 12; }
    .ring__track { stroke: rgb(255 255 255 / 0.18); }
    .ring__value { stroke: var(--verdict); stroke-linecap: round; }
    /* Veredicto del score: tonos claros para que se lean sobre el azul del hero */
    .verdict-critical { --verdict: #f87171; }
    .verdict-warning { --verdict: #fbbf24; }
    .verdict-ok { --verdict: #4ade80; }
    .score-box { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 240px; text-align: center; }
    .verdict-box { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
    .verdict {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border: 1px solid color-mix(in srgb, var(--verdict) 60%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--verdict) 18%, transparent);
      color: var(--verdict);
      font-size: 0.8125rem;
      font-weight: 700;
    }
    .verdict-text { margin: 0; font-size: 0.8125rem; line-height: 1.45; opacity: 0.85; }
    .scale { display: flex; gap: 10px; font-size: 0.6875rem; opacity: 0.75; }
    .scale span { display: inline-flex; align-items: center; gap: 4px; }
    .scale span::before { content: ''; width: 8px; height: 8px; border-radius: 999px; background: var(--verdict); }
    .ring__label {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }
    .ring__label strong { font-size: 2.75rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .ring__label span { font-size: 0.75rem; opacity: 0.8; }

    .figures {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 20px 48px;
      margin: 40px 0 0;
      padding-top: 24px;
      border-top: 1px solid rgb(255 255 255 / 0.2);
    }
    .figures div { display: flex; flex-direction: column-reverse; }
    .figures dt { font-size: 0.8125rem; opacity: 0.75; }
    .figures dd { margin: 0; font-size: 1.75rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }

    /* Cuerpo: índice lateral + contenido */
    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 40px;
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 40px 32px 64px;
    }
    .toc { position: sticky; top: 24px; align-self: start; }
    .toc ol { margin: 0; padding: 0; list-style: none; }
    .toc a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.875rem;
      text-decoration: none;
    }
    .toc a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--text); }
    .toc .count { margin-left: auto; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

    .card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      scroll-margin-top: 16px;
    }
    .card h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 8px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .card h3 { margin: 24px 0 8px; font-size: 1rem; font-weight: 600; }
    .card > p, .card .intro { margin: 0 0 12px; color: var(--muted); }
    .icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--sev, var(--accent)) 12%, transparent);
      color: var(--sev, var(--accent));
      font-size: 1.25rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--sev-bg, var(--sev-info-bg));
      color: var(--sev, var(--sev-info));
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .sev-critical { --sev: var(--sev-critical); --sev-bg: var(--sev-critical-bg); }
    .sev-warning { --sev: var(--sev-warning); --sev-bg: var(--sev-warning-bg); }
    .sev-info { --sev: var(--sev-info); --sev-bg: var(--sev-info-bg); }
    .sev-ok { --sev: var(--sev-ok); --sev-bg: var(--sev-ok-bg); }
    .card h2 .badge { margin-left: auto; }

    /* Resumen */
    .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin: 16px 0 0; padding: 0; list-style: none; }
    .summary li {
      display: flex;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--sev);
      border-radius: var(--radius-sm);
    }
    .summary i { color: var(--sev); font-size: 1.25rem; line-height: 1.3; }

    /* Barras del score */
    .metrics { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
    .metric__head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
    .metric__head span:last-child { font-variant-numeric: tabular-nums; }
    .bar { height: 8px; margin: 6px 0 4px; border-radius: 999px; background: var(--code-bg); overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--sev); }
    .metric p { margin: 0; color: var(--muted); font-size: 0.8125rem; }
    .score-total {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
    }
    .score-total strong { color: var(--text); font-variant-numeric: tabular-nums; }

    /* Tablas */
    .table-wrap { margin: 8px 0 0; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    th {
      background: color-mix(in srgb, var(--accent) 5%, var(--card));
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: color-mix(in srgb, var(--accent) 3%, transparent); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    ul.plain { margin: 8px 0 0; padding-left: 20px; }
    ul.plain li { margin: 4px 0; }
    .note {
      display: flex;
      gap: 10px;
      margin: 12px 0 0;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      color: var(--muted);
      font-size: 0.875rem;
    }
    .note i { color: var(--accent); font-size: 1.125rem; line-height: 1.3; }

    .recs { counter-reset: rec; margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .recs li { counter-increment: rec; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
    .recs li::before {
      content: counter(rec);
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .recs strong { display: block; }
    .recs span { color: var(--muted); font-size: 0.875rem; }

    footer {
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 24px 32px 48px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
    }

    @media (max-width: 1023.98px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .toc { display: none; }
    }
    @media (max-width: 767.98px) {
      .hero__inner { grid-template-columns: minmax(0, 1fr); padding: 40px 16px 32px; }
      .ring { flex: none; width: 116px; height: 116px; }
      .ring__label strong { font-size: 2.25rem; }
      /* Móvil: veredicto, descripción y escala a la derecha del anillo */
      .score-box { flex-direction: row; align-items: center; gap: 20px; max-width: none; margin-top: 28px; text-align: left; }
      .verdict-box { align-items: flex-start; gap: 8px; }
      .figures { gap: 16px 28px; margin-top: 28px; }
      .layout { padding: 24px 16px 40px; }
      .card { padding: 18px; }
      footer { padding: 24px 16px 40px; }
    }
    @media print {
      .toc, .hero__actions { display: none; }
      .layout { grid-template-columns: minmax(0, 1fr); }
      .card { break-inside: avoid; }
    }
  </style>
</head>

  <header class="hero">
    <div class="hero__inner">
      <div>
        <span class="hero__eyebrow"><i class="ph ph-magnifying-glass" aria-hidden="true"></i> <span id="eyebrow"></span></span>
        <h1 id="title"></h1>
        <p class="hero__meta" id="meta"></p>
        <div class="hero__actions">
          <a class="cta cta--solid" id="figma-link" target="_blank" rel="noopener"><i class="ph ph-figma-logo" aria-hidden="true"></i> Abrir en Figma</a>
          <button type="button" class="cta" id="theme-toggle"><i class="ph ph-moon" aria-hidden="true"></i> <span>Modo oscuro</span></button>
        </div>
      </div>
      <div class="score-box" id="score-box">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120"><circle class="ring__track" cx="60" cy="60" r="52" /><circle class="ring__value" id="ring" cx="60" cy="60" r="52" /></svg>
          <div class="ring__label"><strong id="score"></strong><span>de 100</span></div>
        </div>
        <div class="verdict-box">
          <span class="verdict" id="verdict"></span>
          <p class="verdict-text" id="verdict-text"></p>
          <div class="scale" aria-label="Escala del score">
            <span class="verdict-critical">0-49</span><span class="verdict-warning">50-79</span><span class="verdict-ok">80-100</span>
          </div>
        </div>
      </div>
      <dl class="figures" id="figures"></dl>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" aria-label="Índice">
      <p class="eyebrow">Contenido</p>
      <ol id="toc"></ol>
    </nav>
    <main id="main"></main>
  </div>

  <footer id="footer"></footer>

  <script>
    const data = JSON.parse(document.getElementById('audit-data').textContent);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const SEV = {
      critical: { label: 'Crítico', icon: 'warning-octagon' },
      warning: { label: 'Advertencia', icon: 'warning' },
      info: { label: 'Info', icon: 'info' },
      ok: { label: 'Correcto', icon: 'check-circle' }
    };
    const sevOf = ratio => (ratio >= 0.8 ? 'ok' : ratio >= 0.5 ? 'warning' : 'critical');

    document.title = `Auditoría · ${data.file.name}`;
    document.getElementById('eyebrow').textContent = `Auditoría de librería · ${data.date}`;
    document.getElementById('title').innerHTML = `${esc(data.file.name)} <span>Informe de salud</span>`;
    document.getElementById('meta').innerHTML = `${esc(data.scope)} · <code style="background:rgb(255 255 255 / .15)">${esc(data.file.key)}</code>`;
    document.getElementById('figma-link').href = data.file.url;
    document.getElementById('score').textContent = data.score.total;
    const ring = document.getElementById('ring');
    const circ = 2 * Math.PI * 52;
    ring.style.strokeDasharray = circ;
    ring.style.strokeDashoffset = circ * (1 - Math.max(0, Math.min(100, data.score.total)) / 100);
    // Mismos umbrales que las barras del score: 80% verde, 50% ámbar, menos rojo
    const verdict = sevOf(data.score.total / 100);
    const VERDICT = {
      critical: { icon: 'warning-octagon', label: 'Estado crítico', text: 'La librería necesita limpieza antes de seguir creciendo.' },
      warning: { icon: 'warning', label: 'Mejorable', text: 'Base usable con problemas que conviene corregir.' },
      ok: { icon: 'check-circle', label: 'Saludable', text: 'Librería consistente; solo ajustes menores.' }
    }[verdict];
    document.getElementById('score-box').classList.add(`verdict-${verdict}`);
    document.getElementById('verdict').innerHTML = `<i class="ph-fill ph-${VERDICT.icon}" aria-hidden="true"></i> ${VERDICT.label}`;
    document.getElementById('verdict-text').textContent = data.score.penalty
      ? `${VERDICT.text} Base ${data.score.base}, menos ${data.score.penalty} por ${data.score.criticals} ${data.score.criticals === 1 ? 'problema crítico' : 'problemas críticos'}.`
      : VERDICT.text;
    document.getElementById('figures').innerHTML = data.figures
      .map(f => `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join('');

    const blocks = b => {
      const title = b.title ? `<h3>${fmt(b.title)}</h3>` : '';
      if (b.type === 'table') {
        const num = new Set(b.num || []);
        const head = b.columns.map(c => `<th>${esc(c)}</th>`).join('');
        const body = b.rows.map(r => `<tr>${r.map((c, i) => `<td${num.has(i) ? ' class="num"' : ''}>${fmt(c)}</td>`).join('')}</tr>`).join('');
        return `${title}<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
      }
      if (b.type === 'list') return `${title}<ul class="plain">${b.items.map(i => `<li>${fmt(i)}</li>`).join('')}</ul>`;
      if (b.type === 'note') return `<p class="note"><i class="ph ph-lightbulb" aria-hidden="true"></i><span>${fmt(b.text)}</span></p>`;
      if (b.type === 'text') return `${title}<p>${fmt(b.text)}</p>`;
      return '';
    };
    const badge = (sev, text) => `<span class="badge sev-${sev}">${esc(text)}</span>`;

    const cards = [];
    const toc = [];
    const addToc = (id, icon, title, count) =>
      toc.push(`<li><a href="#${id}"><i class="ph ph-${icon}" aria-hidden="true"></i>${esc(title)}${count != null ? `<span class="count">${esc(count)}</span>` : ''}</a></li>`);

    addToc('resumen', 'list-checks', 'Resumen');
    cards.push(`<section class="card" id="resumen">
      <h2><span class="icon"><i class="ph ph-list-checks"></i></span>Resumen ejecutivo</h2>
      <ul class="summary">${data.summary.map(s => `<li class="sev-${s.severity}"><i class="ph-fill ph-${SEV[s.severity].icon}" aria-hidden="true"></i><span>${fmt(s.text)}</span></li>`).join('')}</ul>
    </section>`);

    addToc('score-card', 'gauge', 'Score de salud', data.score.total);
    cards.push(`<section class="card" id="score-card">
      <h2><span class="icon"><i class="ph ph-gauge"></i></span>Score de salud</h2>
      <div class="metrics">${data.score.metrics.map(m => {
        const sev = sevOf(m.points / m.weight);
        return `<div class="metric sev-${sev}">
          <div class="metric__head"><span>${esc(m.name)}</span><span>${m.points} / ${m.weight}</span></div>
          <div class="bar"><span style="width:${(m.points / m.weight) * 100}%"></span></div>
          <p>${fmt(m.reason)}</p></div>`;
      }).join('')}</div>
      <div class="score-total"><span>Base <strong>${data.score.base}</strong></span><span>Penalización <strong>-${data.score.penalty}</strong> (${data.score.criticals} ${data.score.criticals === 1 ? 'crítico' : 'críticos'} x 5)</span><span>Total <strong>${data.score.total} / 100</strong></span></div>
    </section>`);

    for (const s of data.sections) {
      addToc(s.id, s.icon, s.title, s.count);
      const label = s.count != null ? `${s.count} · ${SEV[s.severity].label}` : SEV[s.severity].label;
      cards.push(`<section class="card sev-${s.severity}" id="${esc(s.id)}">
        <h2><span class="icon"><i class="ph ph-${esc(s.icon)}"></i></span>${esc(s.title)}${badge(s.severity, label)}</h2>
        ${s.intro ? `<p class="intro">${fmt(s.intro)}</p>` : ''}
        ${(s.blocks || []).map(blocks).join('')}
      </section>`);
    }

    addToc('recomendaciones', 'path', 'Recomendaciones', data.recommendations.length);
    cards.push(`<section class="card" id="recomendaciones">
      <h2><span class="icon"><i class="ph ph-path"></i></span>Recomendaciones priorizadas</h2>
      <ol class="recs">${data.recommendations.map(r => `<li><div><strong>${fmt(r.title)}</strong><span>${fmt(r.detail)}</span></div></li>`).join('')}</ol>
    </section>`);

    addToc('metodologia', 'flask', 'Metodología');
    cards.push(`<section class="card" id="metodologia">
      <h2><span class="icon"><i class="ph ph-flask"></i></span>Metodología</h2>
      <ul class="plain">${data.methodology.steps.map(i => `<li>${fmt(i)}</li>`).join('')}</ul>
      ${data.methodology.limits.length ? `<h3>Limitaciones</h3><ul class="plain">${data.methodology.limits.map(i => `<li>${fmt(i)}</li>`).join('')}</ul>` : ''}
    </section>`);

    document.getElementById('main').innerHTML = cards.join('');
    document.getElementById('toc').innerHTML = toc.join('');
    document.getElementById('footer').textContent = `Informe generado con la skill component-audit · ${data.file.name} · ${data.date}`;

    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const setTheme = dark => {
      root.classList.toggle('dark', dark);
      toggle.querySelector('i').className = `ph ph-${dark ? 'sun' : 'moon'}`;
      toggle.querySelector('span').textContent = dark ? 'Modo claro' : 'Modo oscuro';
    };
    let stored = null;
    try { stored = localStorage.getItem('audit-theme'); } catch {}
    setTheme(stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
    toggle.addEventListener('click', () => {
      const dark = !root.classList.contains('dark');
      setTheme(dark);
      try { localStorage.setItem('audit-theme', dark ? 'dark' : 'light'); } catch {}
    });
  </script>
</body>
</html>
